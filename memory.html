<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory | Card</title>
    <style>
      .card {
        height: 300px;
        width: 200px;
        background-color: rgb(81, 13, 158);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: transparent;
        font-size: 80px;
        transition: all 1s;
      }

      .card-open {
        color: white;
      }

      .container {
        width: 860px;
        margin: 0 auto;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .card-match {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div class="container" id="container"></div>

    <script>
      const shapes = ["🤡", "🙈", "👹", "🧟‍♂️", "🍀", "🌊"];
      const cards = [];

      let openIndex1 = -1;
      let openIndex2 = -2;

      for (let i = 0; i < shapes.length; i++) {
        cards.push(shapes[i]);
        cards.push(shapes[i]);
      }

      function shuffle(array) {
        let currentIndex = array.length;

        while (currentIndex != 0) {
          let randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;
          [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
      }

      shuffle(cards);

      function startGame() {
        let reslut = "";
        for (let i = 0; i < cards.length; i++) {
          reslut += `<div class="card" id="card${i}" onclick="reveal(${i})">${cards[i]}</div>`;
        }

        document.getElementById("container").innerHTML = reslut;
      }

      startGame();

      function reveal(index) {
        const card = document.getElementById(`card${index}`);
        card.classList.add("card-open");

        if (openIndex1 == -1) {
          openIndex1 = index;
        } else {
          openIndex2 = index;

          if (cards[openIndex1] == cards[openIndex2]) {
            console.log("SAME");
            document.getElementById(`card${openIndex1}`).classList.add("card-match");
            document.getElementById(`card${openIndex2}`).classList.add("card-match");

            openIndex1 = -1;
            openIndex2 = -1;
          } else {
            console.log("DIFF");

            setTimeout(function () {
              document.getElementById(`card${openIndex1}`).classList.remove("card-open");
              document.getElementById(`card${openIndex2}`).classList.remove("card-open");

              openIndex1 = -1;
              openIndex2 = -1;
            }, 500);
          }

          console.log(openIndex1, openIndex2);
        }
      }

      //     if (card.classList.contains("card-open")) {
      //       card.classList.remove("card-open");
      //     } else {
      //       card.classList.add("card-open");
      //     }
      //   }
    </script>
  </body>
</html>
